# BuggeeNet Redis — DEV profile
# Player snapshots live here. Treat this file as data, not cache.

bind 0.0.0.0
protected-mode yes
port 6379
requirepass buggee_dev_only_change_me

# NEVER evict player data. If Redis hits maxmemory it must error, not delete keys.
maxmemory-policy noeviction

# Durability: AOF + RDB. A snapshot you can lose is an inventory you can lose.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Keep logs small; the game servers are the noisy ones.
loglevel notice
dir /data
dbfilename buggee.rdb
appendfilename "buggee.aof"

# Sanity: refuse to run if persistence can't be set up.
stop-writes-on-bgsave-error yes
